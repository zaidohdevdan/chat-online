services:
  postgres:
    image: postgres:15-alpine
    container_name: chat-online-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chat_online}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-chat_app} -d $${POSTGRES_DB:-chat_online}"]
      interval: 3s
      timeout: 3s
      retries: 10

